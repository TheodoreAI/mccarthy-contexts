value: 'Prove Fano''s inequality with the constant log M rather than the textbook log (M - 1): H(truth | guess) <= h(Pe) + Pe * log M.'
reason: 'The weaker constant is what makes the formalization tractable, and it is deliberate rather than sloppiness. It lets the comparison law be a SUB-probability instead of a probability: each row is bounded by spreading Pe / M over the whole alphabet rather than over the M - 1 wrong answers, so no cardinality arithmetic appears anywhere in the proof, and the M >= 2 side condition disappears. A weak converse needs only this form. Do not ''fix'' the constant to log (M - 1) without a concrete consumer that requires it -- doing so reintroduces off-diagonal counting through the entire argument.'
